{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#183b56">
  <title>{% block title %}AURA · Chamada acadêmica{% endblock %}</title>
  <link rel="icon" href="{% static 'brand.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'app.css' %}">
  {% block styles %}{% endblock %}
</head>
<body data-role="{{ area|default:'' }}" class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Ir para o conteúdo</a>
  {% block layout %}{% endblock %}
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <script src="{% static 'api.js' %}"></script>
  <script src="{% static 'ui.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
