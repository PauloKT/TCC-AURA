{% extends 'base.html' %}
{% block layout %}
<div class="app-layout">
  <div class="app-body">
    <header class="topbar">
      {% include 'includes/brand.html' %}
      <div class="topbar-right">
        <span id="today-label"></span>
        <a href="{% if area == 'professor' %}/professor.html{% else %}/aluno.html{% endif %}#perfil" class="account-link" aria-label="Ver meu perfil">
          <span class="account-copy"><span id="user-name" class="account-name">Minha conta</span><small>{% if area == 'professor' %}Professor{% else %}Aluno{% endif %}</small></span>
          <span class="avatar" id="user-avatar" aria-hidden="true">A</span>
        </a>
        <button class="icon-button menu-toggle" id="menu-toggle" aria-label="Abrir menu de navegação" aria-expanded="false" aria-controls="navigation-menu"><span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span></button>
      </div>
      {% include 'includes/navigation.html' %}
    </header>
    <main id="main" class="main-content" tabindex="-1">{% block content %}{% endblock %}</main>
    <footer class="app-footer">AURA <span>Presença que acompanha o aprendizado.</span></footer>
  </div>
</div>
{% endblock %}
