version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aura
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
    volumes:
      - aura_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  web:
    build: .
    working_dir: /app/backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_NAME: aura
      DB_USER: aura
      DB_PASSWORD: aura
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: celery -A backend worker -l info
    env_file: .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
    depends_on:
      - db
    profiles: ["celery"]  # Ative com: docker compose --profile celery up

volumes:
  aura_pgdata:
